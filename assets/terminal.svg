<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .t-code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #38bdf8;
    }
  </style>

  <!-- Terminal Window Shell -->
  <rect width="900" height="280" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect width="900" height="38" rx="12" fill="#0f172a" />
  <rect y="26" width="900" height="12" fill="#0f172a" />
  <line x1="0" y1="38" x2="900" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />

  <!-- Header Title -->
  <text x="450" y="24" text-anchor="middle" fill="#94a3b8" class="t-code" font-size="12" font-weight="600">
    sujal@juspay-node-01:~ (zsh)
  </text>

  <!-- Terminal Session Output -->
  <g transform="translate(30, 70)">
    <!-- Command 1 -->
    <text x="0" y="0" class="t-code">
      <tspan fill="#34d399">➜</tspan>
      <tspan fill="#38bdf8"> ~</tspan>
      <tspan fill="#f1f5f9"> sujal --version --system-profile</tspan>
    </text>

    <!-- Output Lines -->
    <text x="0" y="24" class="t-code" fill="#64748b">
      [SYSTEM] Sujal Vijayvargiya v2026.11 // SDE-1 @ Juspay Technologies (Bangalore, IN)
    </text>

    <text x="0" y="46" class="t-code">
      <tspan fill="#a855f7">▶ CORE RUNTIMES:</tspan>
      <tspan fill="#cbd5e1"> Haskell (Pure FP) • Python 3.12 (FastAPI) • TypeScript (Full-Stack) • C++</tspan>
    </text>

    <text x="0" y="68" class="t-code">
      <tspan fill="#38bdf8">▶ FINTECH FABRIC:</tspan>
      <tspan fill="#cbd5e1"> Multi-Region Blueprint (SG/HK) • 3-Step Payment Orchestration • Kafka Streams</tspan>
    </text>

    <text x="0" y="90" class="t-code">
      <tspan fill="#34d399">▶ NEURAL ENGINE:</tspan>
      <tspan fill="#cbd5e1"> AlgoMentor (Groq Llama-3.3-70B + AWS Polly Voice) • Meeting Intel (Gemini API)</tspan>
    </text>

    <text x="0" y="112" class="t-code">
      <tspan fill="#fbbf24">▶ GUARANTEES:</tspan>
      <tspan fill="#cbd5e1"> Strict Idempotency • State Machine Reconciliations • Sub-50ms Critical Paths</tspan>
    </text>

    <text x="0" y="134" class="t-code" fill="#64748b">
      -----------------------------------------------------------------------------------------
    </text>

    <!-- Command 2 Prompt + Blinking Cursor -->
    <text x="0" y="160" class="t-code">
      <tspan fill="#34d399">➜</tspan>
      <tspan fill="#38bdf8"> ~</tspan>
      <tspan fill="#f1f5f9"> sujal --open-channels</tspan>
      <tspan fill="#34d399"> [Status: Listening on Port 443 / Ready to Connect]</tspan>
    </text>

    <!-- Next line with active blinking cursor -->
    <text x="0" y="184" class="t-code">
      <tspan fill="#34d399">➜</tspan>
      <tspan fill="#38bdf8"> ~</tspan>
      <tspan fill="#94a3b8"> _</tspan>
    </text>
    <rect x="22" y="172" width="8" height="14" class="cursor" />
  </g>
</svg>