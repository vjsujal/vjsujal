<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080d18" />
    </linearGradient>

    <!-- Metallic Metric Gradient -->
    <linearGradient id="metricWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cardGridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <!-- Crisp Soft Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    @keyframes pulseLedSoft {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.35; }
    }
    .led { animation: pulseLedSoft 2.8s infinite ease-in-out; }
  </style>

  <!-- Outer Canvas Base -->
  <rect width="900" height="170" rx="14" fill="#060911" />

  <!-- CARD 1: Regional Blueprint -->
  <g transform="translate(10, 10)">
    <rect width="280" height="150" rx="10" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.2" />
    <rect width="280" height="150" rx="10" fill="url(#cardGridPattern)" />
    
    <!-- Top Pill -->
    <circle cx="20" cy="22" r="3.5" fill="#38bdf8" class="led" filter="url(#softGlow)" />
    <text x="32" y="26" fill="#64748b" class="mono" font-size="10" font-weight="600" letter-spacing="1">MULTI-REGION BLUEPRINT</text>
    
    <!-- Main Metric -->
    <text x="20" y="66" fill="url(#metricWhite)" class="mono" font-size="28" font-weight="700">45d ➔ 15d</text>
    <text x="20" y="88" fill="#94a3b8" class="sans" font-size="12" font-weight="500">-67% Regional Deployment Time</text>
    
    <!-- Stack Divider & Details -->
    <line x1="20" y1="106" x2="260" y2="106" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="128" fill="#93c5fd" class="mono" font-size="10.5">SG &amp; HK STACKS // HASKELL</text>
    <text x="20" y="142" fill="#475569" class="mono" font-size="9.5">Euler • PaymentPage • Recon</text>
  </g>

  <!-- CARD 2: Payment Orchestration -->
  <g transform="translate(310, 10)">
    <rect width="280" height="150" rx="10" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.2" />
    <rect width="280" height="150" rx="10" fill="url(#cardGridPattern)" />
    
    <!-- Top Pill -->
    <circle cx="20" cy="22" r="3.5" fill="#10b981" class="led" filter="url(#softGlow)" />
    <text x="32" y="26" fill="#64748b" class="mono" font-size="10" font-weight="600" letter-spacing="1">PAYMENT ORCHESTRATION</text>
    
    <!-- Main Metric -->
    <text x="20" y="66" fill="url(#metricWhite)" class="mono" font-size="26" font-weight="700">3-STEP LIFECYCLE</text>
    <text x="20" y="88" fill="#94a3b8" class="sans" font-size="12" font-weight="500">Auth ➔ 3DS ➔ Capture</text>
    
    <!-- Stack Divider & Details -->
    <line x1="20" y1="106" x2="260" y2="106" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="128" fill="#86efac" class="mono" font-size="10.5">STATE MACHINES // WECHATPAY</text>
    <text x="20" y="142" fill="#475569" class="mono" font-size="9.5">Alipay • FPS Native Wallet SDKs</text>
  </g>

  <!-- CARD 3: AlgoMentor AI Engine -->
  <g transform="translate(610, 10)">
    <rect width="280" height="150" rx="10" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.2" />
    <rect width="280" height="150" rx="10" fill="url(#cardGridPattern)" />
    
    <!-- Top Pill -->
    <circle cx="20" cy="22" r="3.5" fill="#818cf8" class="led" filter="url(#softGlow)" />
    <text x="32" y="26" fill="#64748b" class="mono" font-size="10" font-weight="600" letter-spacing="1">AI INTERVIEW ENGINE</text>
    
    <!-- Main Metric -->
    <text x="20" y="66" fill="url(#metricWhite)" class="mono" font-size="26" font-weight="700">VOICE + ADAPTIVE</text>
    <text x="20" y="88" fill="#94a3b8" class="sans" font-size="12" font-weight="500">Real-Time FAANG DSA Simulation</text>
    
    <!-- Stack Divider & Details -->
    <line x1="20" y1="106" x2="260" y2="106" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="128" fill="#c7d2fe" class="mono" font-size="10.5">GROQ LLAMA-3.3 // AWS POLLY</text>
    <text x="20" y="142" fill="#475569" class="mono" font-size="9.5">Next.js • FastAPI • Speech AI</text>
  </g>
</svg>