<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    @keyframes pulseLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .led { animation: pulseLed 2.2s infinite ease-in-out; }
  </style>

  <!-- Container Base -->
  <rect width="900" height="170" rx="14" fill="#050811" />

  <!-- CARD 1: Regional Blueprint -->
  <g transform="translate(10, 10)">
    <rect width="280" height="150" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect width="280" height="150" rx="10" fill="url(#cardGrid)" />
    <!-- Header -->
    <circle cx="20" cy="22" r="3.5" fill="#38bdf8" class="led" filter="url(#glow)" />
    <text x="32" y="26" fill="#64748b" class="mono" font-size="10.5" font-weight="600" letter-spacing="1">MULTI-REGION BLUEPRINT</text>
    <!-- Value -->
    <text x="20" y="66" fill="url(#neonCyan)" class="mono" font-size="28" font-weight="800" filter="url(#glow)">45d ➔ 15d</text>
    <text x="20" y="88" fill="#94a3b8" class="sans" font-size="12" font-weight="500">-67% Deployment Time</text>
    <!-- Footer / Stack Tags -->
    <line x1="20" y1="106" x2="260" y2="106" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="128" fill="#38bdf8" class="mono" font-size="10.5">SG &amp; HK STACKS // HASKELL</text>
    <text x="20" y="142" fill="#475569" class="mono" font-size="9.5">Euler • PaymentPage • Recon</text>
  </g>

  <!-- CARD 2: Payment Orchestration -->
  <g transform="translate(310, 10)">
    <rect width="280" height="150" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect width="280" height="150" rx="10" fill="url(#cardGrid)" />
    <!-- Header -->
    <circle cx="20" cy="22" r="3.5" fill="#34d399" class="led" filter="url(#glow)" />
    <text x="32" y="26" fill="#64748b" class="mono" font-size="10.5" font-weight="600" letter-spacing="1">PAYMENT ORCHESTRATION</text>
    <!-- Value -->
    <text x="20" y="66" fill="url(#neonGreen)" class="mono" font-size="26" font-weight="800" filter="url(#glow)">3-STEP LIFECYCLE</text>
    <text x="20" y="88" fill="#94a3b8" class="sans" font-size="12" font-weight="500">Auth ➔ 3DS ➔ Capture</text>
    <!-- Footer / Stack Tags -->
    <line x1="20" y1="106" x2="260" y2="106" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="128" fill="#34d399" class="mono" font-size="10.5">STATE MACHINES // WECHATPAY</text>
    <text x="20" y="142" fill="#475569" class="mono" font-size="9.5">Alipay • FPS Native Wallet SDKs</text>
  </g>

  <!-- CARD 3: AlgoMentor AI Engine -->
  <g transform="translate(610, 10)">
    <rect width="280" height="150" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect width="280" height="150" rx="10" fill="url(#cardGrid)" />
    <!-- Header -->
    <circle cx="20" cy="22" r="3.5" fill="#c084fc" class="led" filter="url(#glow)" />
    <text x="32" y="26" fill="#64748b" class="mono" font-size="10.5" font-weight="600" letter-spacing="1">AI INTERVIEW ENGINE</text>
    <!-- Value -->
    <text x="20" y="66" fill="url(#neonPurple)" class="mono" font-size="26" font-weight="800" filter="url(#glow)">VOICE + ADAPTIVE</text>
    <text x="20" y="88" fill="#94a3b8" class="sans" font-size="12" font-weight="500">Real-Time FAANG DSA Simulation</text>
    <!-- Footer / Stack Tags -->
    <line x1="20" y1="106" x2="260" y2="106" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="128" fill="#c084fc" class="mono" font-size="10.5">GROQ LLAMA-3.3 // AWS POLLY</text>
    <text x="20" y="142" fill="#475569" class="mono" font-size="9.5">Next.js • FastAPI • Speech AI</text>
  </g>
</svg>