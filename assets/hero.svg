<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Neon Cyan / Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="30" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-300px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-360px); }
      100% { transform: translateY(360px); }
    }
    @keyframes borderTrace {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 2520; }
    }
    .pulsing-dot {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: center;
    }
    .wave-line-1 {
      animation: waveFlow 12s linear infinite;
    }
    .wave-line-2 {
      animation: waveFlow 8s linear infinite;
    }
    .terminal-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .tag-text {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Overlay -->
  <rect width="900" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Ambient Glow Orbs -->
  <circle cx="80" cy="80" r="120" fill="#38bdf8" fill-opacity="0.06" filter="url(#neonGlow)" />
  <circle cx="820" cy="280" r="140" fill="#a855f7" fill-opacity="0.06" filter="url(#neonGlow)" />
  <circle cx="450" cy="180" r="100" fill="#6366f1" fill-opacity="0.04" filter="url(#neonGlow)" />

  <!-- Outer Border with Trace Animation -->
  <rect x="2" y="2" width="896" height="356" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="356" rx="15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="140 700" style="animation: borderTrace 10s linear infinite;" filter="url(#subtleGlow)" />

  <!-- Top System Bar -->
  <rect x="2" y="2" width="896" height="42" rx="15" fill="#0f172a" fill-opacity="0.6" />
  <line x1="2" y1="44" x2="898" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="28" cy="23" r="5.5" fill="#ef4444" />
  <circle cx="46" cy="23" r="5.5" fill="#f59e0b" />
  <circle cx="64" cy="23" r="5.5" fill="#10b981" />

  <!-- System Breadcrumb -->
  <text x="88" y="27" fill="#64748b" class="terminal-text" font-size="12">node::blr-01 / juspay-core / payment-pipeline / sujal.vj</text>

  <!-- Online Telemetry Status Pill (Top Right) -->
  <g transform="translate(685, 12)">
    <rect width="188" height="24" rx="12" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
    <circle cx="15" cy="12" r="4.5" fill="#10b981" class="pulsing-dot" filter="url(#subtleGlow)" />
    <text x="27" y="16" fill="#34d399" class="tag-text">SYSTEM: OPERATIONAL</text>
  </g>

  <!-- Hero Content Section -->
  <!-- Monospace Subtitle / Greeting -->
  <g transform="translate(50, 95)">
    <text x="0" y="0" fill="#38bdf8" class="terminal-text" font-size="14" font-weight="600" letter-spacing="1.5">
      &gt; INITIALIZING ARCHITECT PROTOCOL...
    </text>
  </g>

  <!-- Main Identity Name -->
  <g transform="translate(50, 150)">
    <text x="0" y="0" fill="url(#textShimmer)" class="title-text" font-size="44" filter="url(#subtleGlow)">
      Sujal Vijayvargiya
    </text>
  </g>

  <!-- Role & Headline Badge -->
  <g transform="translate(50, 190)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="500">
      Software Development Engineer
      <tspan fill="#38bdf8" font-weight="700"> @ Juspay Technologies</tspan>
    </text>
  </g>

  <!-- Mission Statement Tagline -->
  <g transform="translate(50, 222)">
    <text x="0" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5">
      Architecting high-scale payment engines, multi-region stacks &amp; conversational AI workflows.
    </text>
  </g>

  <!-- Spec / Pillar Pills -->
  <g transform="translate(50, 252)">
    <!-- Pill 1: Fintech Core -->
    <rect x="0" y="0" width="168" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="84" y="19" text-anchor="middle" fill="#38bdf8" class="tag-text">⚡ PAYMENT ORCHESTRATION</text>

    <!-- Pill 2: Distributed FP -->
    <rect x="180" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="260" y="19" text-anchor="middle" fill="#a5b4fc" class="tag-text">λ HASKELL &amp; FASTAPI</text>

    <!-- Pill 3: AI Platforms -->
    <rect x="352" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <text x="432" y="19" text-anchor="middle" fill="#d8b4fe" class="tag-text">🤖 VOICE &amp; LLM AGENTS</text>

    <!-- Pill 4: Scale -->
    <rect x="524" y="0" width="146" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <text x="597" y="19" text-anchor="middle" fill="#6ee7b7" class="tag-text">🌐 MULTI-REGION SG/HK</text>
  </g>

  <!-- Decorative Circuit Traces / Animated Frequency Waves across bottom right -->
  <g transform="translate(540, 110)">
    <!-- Circuit diagram aesthetic -->
    <path d="M 40 40 H 120 L 160 80 H 280" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="40" cy="40" r="3" fill="#38bdf8" />
    <circle cx="160" cy="80" r="3" fill="#818cf8" />
    <circle cx="280" cy="80" r="4" fill="#34d399" />

    <path d="M 90 10 H 190 L 230 50 H 310" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="90" cy="10" r="3" fill="#a855f7" />
    <circle cx="310" cy="50" r="3" fill="#38bdf8" />

    <!-- Mini Telemetry Box -->
    <rect x="150" y="100" width="165" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="162" y="120" fill="#64748b" class="terminal-text" font-size="10">RECONCILIATION SLA</text>
    <text x="162" y="137" fill="#38bdf8" class="terminal-text" font-size="14" font-weight="700">99.999% IDEMPOTENT</text>
  </g>

  <!-- Animated Sound/Pulse Wave on Bottom Border -->
  <g transform="translate(0, 315)">
    <!-- Base line -->
    <line x1="50" y1="20" x2="850" y2="20" stroke="#1e293b" stroke-width="1" />

    <!-- Running coordinate tag -->
    <text x="50" y="32" fill="#475569" class="terminal-text" font-size="10">LAT: 12.9716° N / LON: 77.5946° E [BLR_HQ]</text>
    <text x="850" y="32" text-anchor="end" fill="#475569" class="terminal-text" font-size="10">PROTOCOL: TLS_1.3 // ZERO_TRUST</text>
  </g>
</svg>